<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect / DNS Prefetch para recursos críticos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="dns-prefetch" href="//wa.me" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/src/assets/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme Color (mobile address bar) -->
    <meta name="theme-color" content="#273020" />
    <meta name="msapplication-TileColor" content="#273020" />

    <!-- Geo / Local SEO -->
    <meta name="geo.region" content="BR-RJ" />
    <meta name="geo.placename" content="Teresópolis" />
    <meta name="geo.position" content="-22.4029;-42.9656" />
    <meta name="ICBM" content="-22.4029, -42.9656" />

    <!-- Author / Publisher / Language -->
    <meta name="author" content="GREENLAND" />
    <meta name="publisher" content="GREENLAND" />
    <meta name="copyright" content="GREENLAND" />
    <meta name="language" content="Portuguese" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Fallback SEO (sobrescrito por react-helmet-async em runtime) -->
    <title>GREENLAND | Terrenos na Serra do Rio de Janeiro</title>
    <meta
      name="description"
      content="Condomínio de terrenos pronto em Teresópolis, na Serra do RJ. Terrenos com RGI, água e luz instalados, o maior lazer da cidade e mata atlântica preservada."
    />
    <link rel="canonical" href="https://www.greenlandteresopolis.com.br/" />

    <!-- Open Graph fallback -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.greenlandteresopolis.com.br/" />
    <meta property="og:title" content="GREENLAND | Terrenos na Serra do Rio de Janeiro" />
    <meta
      property="og:description"
      content="Condomínio de terrenos pronto em Teresópolis, na Serra do RJ. Terrenos com RGI, água e luz instalados, o maior lazer da cidade e mata atlântica preservada."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="GREENLAND" />

    <!-- Twitter Card fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GREENLAND | Terrenos na Serra do Rio de Janeiro" />
    <meta
      name="twitter:description"
      content="Condomínio de terrenos pronto em Teresópolis, na Serra do RJ. Terrenos com RGI, água e luz instalados, o maior lazer da cidade e mata atlântica preservada."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
